name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly on the default branch — catches runner-image and SDK drift early.
    - cron: '23 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Xcode 26.6 (build 17F113) — the image default on macos-26 at the time this
  # workflow was added; pinned via DEVELOPER_DIR so a future change of the
  # image's default Xcode cannot drift the toolchain under us silently.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    name: Unit tests (MobileOrg scheme)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The "Update Bundle Version Script" build phase runs
          # `git rev-list HEAD --count` — it needs full history.
          fetch-depth: 0

      - name: Resolve simulator destination
        run: |
          set -euo pipefail
          # Device names and runtime versions shift with runner-image rolls
          # (image 20261013.0424 dropped the pinned "iPhone 17, OS=26.5"
          # pairing); pick the newest installed iOS runtime that has an
          # iPhone instead of pinning either.
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          rows = []
          for runtime, devices in data["devices"].items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              os_version = runtime.split("com.apple.CoreSimulator.SimRuntime.iOS-", 1)[-1].replace("-", ".")
              rows += [(os_version, d["name"]) for d in devices
                       if d.get("isAvailable") and d["name"].startswith("iPhone")]
          rows.sort(key=lambda r: (tuple(map(int, r[0].split("."))), r[1]), reverse=True)
          if not rows:
              subprocess.run(["xcrun", "simctl", "list", "devices", "available"])
              raise SystemExit("No available iPhone simulator device found")
          os_version, name = rows[0]
          destination = f"platform=iOS Simulator,name={name},OS={os_version}"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_DESTINATION={destination}\n")
          print(f"Resolved destination: {destination}")
          PY

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve SwiftPM dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project MobileOrg.xcodeproj \
            -scheme MobileOrg

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MobileOrg.xcodeproj \
            -scheme MobileOrg \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-test.log | xcbeautify

      - name: Upload raw test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-log-${{ github.run_id }}
          path: /tmp/xcodebuild-test.log
          if-no-files-found: ignore

  test-webdav:
    name: WebDAV sync tests (All Tests scheme, non-blocking)
    runs-on: macos-26
    timeout-minutes: 30
    # Transitional non-blocking lane pending the regression-harness task:
    # nine CI runs (see PR #1) show the WebDAV suite is statefully coupled
    # across tests — the shared host-app process (SyncManager/
    # TransferManager singletons, shared Core Data context and UI observers)
    # and mutations the sync tests leave in the fixture content — matching
    # the fork audit's documented order-dependency and shared-MOC risks.
    # The job keeps running and reporting; the regression-harness task owns
    # stabilizing the suite and re-enabling this as a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve simulator destination
        run: |
          set -euo pipefail
          # Device names and runtime versions shift with runner-image rolls
          # (image 20261013.0424 dropped the pinned "iPhone 17, OS=26.5"
          # pairing); pick the newest installed iOS runtime that has an
          # iPhone instead of pinning either.
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          rows = []
          for runtime, devices in data["devices"].items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              os_version = runtime.split("com.apple.CoreSimulator.SimRuntime.iOS-", 1)[-1].replace("-", ".")
              rows += [(os_version, d["name"]) for d in devices
                       if d.get("isAvailable") and d["name"].startswith("iPhone")]
          rows.sort(key=lambda r: (tuple(map(int, r[0].split("."))), r[1]), reverse=True)
          if not rows:
              subprocess.run(["xcrun", "simctl", "list", "devices", "available"])
              raise SystemExit("No available iPhone simulator device found")
          os_version, name = rows[0]
          destination = f"platform=iOS Simulator,name={name},OS={os_version}"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_DESTINATION={destination}\n")
          print(f"Resolved destination: {destination}")
          PY

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      # Builds the WebDAV fixture (Tools/tinydav, vendored dependencies —
      # no module downloads). Resolves from the runner's preinstalled Go tool
      # cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/tinydav/go.mod
          cache-dependency-path: Tools/tinydav/go.sum

      - name: Start WebDAV fixture
        run: ./Scripts/WebDAV-Server-Start.sh

      - name: Smoke-check WebDAV fixture
        run: |
          curl -k --fail --silent --show-error --max-time 10 \
            -u schnuddelhuddel:schnuddelhuddel \
            -X PROPFIND -H 'Depth: 1' \
            https://mobileOrgWebDav.schnuddelhuddel.de:32773/ -o /dev/null
          curl -k --fail --silent --show-error --max-time 10 \
            -u schnuddelhuddel:schnuddelhuddel \
            https://mobileOrgWebDav.schnuddelhuddel.de:32773/index.org -o /dev/null
          status=$(curl -k -s --max-time 10 -o /dev/null -w '%{http_code}' \
            https://mobileOrgWebDav.schnuddelhuddel.de:32773/index.org)
          if [ "$status" != "401" ]; then
            echo "Fixture returned $status without credentials (expected 401)" >&2
            exit 1
          fi

      # Reproduces the app's challenge handling — accept any server
      # certificate on the server-trust challenge, then answer the basic-auth
      # challenge — so a trust-override regression surfaces in its own step
      # instead of as a silent zero-download sync inside the tests.
      - name: Verify URLSession trust handling
        run: |
          swift Tools/tinydav/diagnostics/urlsession-trust-probe.swift \
            https://127.0.0.1:32773/index.org \
            schnuddelhuddel schnuddelhuddel

      - name: Run WebDAV sync tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MobileOrg.xcodeproj \
            -scheme 'All Tests' \
            -destination "$SIMULATOR_DESTINATION" \
            -only-testing:MobileOrgTests/WebDavTests \
            -only-testing:MobileOrgTests/WebDavSyncContractTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-webdav.log | xcbeautify

      - name: Stop WebDAV fixture
        if: always()
        run: ./Scripts/WebDAV-Server-Stop.sh

      - name: Dump fixture request log
        if: failure()
        run: cat /tmp/mobileorg-tinydav.log || true

      - name: Upload raw test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-webdav-test-log-${{ github.run_id }}
          path: |
            /tmp/xcodebuild-webdav.log
            /tmp/mobileorg-tinydav.log
          if-no-files-found: ignore
